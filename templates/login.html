<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Authentication Required</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo svg {
            width: 52px;
            height: 52px;
            color: #1a73e8;
        }

        h1 {
            font-size: 1.3rem;
            color: #202124;
            text-align: center;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #5f6368;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #3c4043;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 0.95rem;
            color: #202124;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }

        button[type="submit"] {
            width: 100%;
            padding: 11px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        button:hover { background: #1557b0; }

        .notice {
            font-size: 0.78rem;
            color: #80868b;
            text-align: center;
            margin-top: 20px;
        }

        /* Success / loading state */
        .connecting {
            text-align: center;
            padding: 20px 0;
        }

        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #e8eaed;
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .connecting h2 { color: #202124; font-size: 1.1rem; margin-bottom: 8px; }
        .connecting p  { color: #5f6368; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="card">

    {% if success %}
    <!-- Shown after credentials are submitted -->
    <div class="connecting">
        <div class="spinner"></div>
        <h2>Connecting to network...</h2>
        <p>Please wait while your device is being authenticated.</p>
    </div>

    {% else %}
    <!-- Login form -->
    <div class="logo">
        <!-- WiFi icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/>
        </svg>
    </div>

    <h1>Network Authentication</h1>
    <p class="subtitle">Enter your network credentials to continue</p>

    <form method="POST" action="/login">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Enter username" autocomplete="off" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter network password" required>
        </div>
        <button type="submit">Connect</button>
    </form>

    <p class="notice">Your connection is being verified by the network administrator.</p>
    {% endif %}

</div>
</body>
</html>
